<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Ali Hussain</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef9ff 0%, #ffffff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 60px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 450px;
    }
    .icon {
      font-size: 4rem;
      color: #0077b6;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      color: #1d2d44;
      margin-bottom: 15px;
    }
    p {
      color: #6c757d;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #0077b6;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }
    a:hover { background: #023e8a; }
  </style>
</head>
<body>
  <div class="box">
    <i class="fas fa-check-circle icon"></i>
    <h1>Message Sent Successfully!</h1>
    <p>Thank you for reaching out. I've received your message and will get back to you within 24 hours.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
